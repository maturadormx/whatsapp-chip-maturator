apiVersion: 1

datasources:
  - name: Loki Local
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: chipId
          matcherRegex: '"chipId":"([^"]+)"'
          url: ""
        - name: userId
          matcherRegex: '"userId":"([^"]+)"'
          url: ""
